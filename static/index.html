<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigChange — Same Site Opportunities</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 14px; }

.topbar { background: #185FA5; padding: 0 1.5rem; height: 52px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 15px; font-weight: 600; color: #fff; }
.topbar-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-left: 12px; }
.conn-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; }
.conn-badge.error { background: #E24B4A; }
.btn-refresh { padding: 5px 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: 7px; background: transparent; color: #fff; font-size: 12px; cursor: pointer; }

.metrics { display: flex; gap: 1px; background: #e5e5e3; border-bottom: 1px solid #e5e5e3; }
.metric { flex: 1; background: #fff; padding: 12px 1rem; text-align: center; }
.metric .m-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.metric .m-value { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.metric .m-value.blue { color: #185FA5; }
.metric .m-value.green { color: #3B6D11; }
.metric .m-value.red { color: #A32D2D; }

.main { padding: 1.25rem; overflow-y: auto; height: calc(100vh - 101px); background: #f5f5f3; }

.section-header { font-size: 13px; color: #888; margin-bottom: 1rem; }

.match-card { background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.match-site { font-size: 12px; font-weight: 600; color: #185FA5; margin-bottom: 10px; }
.match-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.arrow { text-align: center; padding-top: 24px; font-size: 18px; color: #185FA5; }

.card-unassigned { background: #FFF8F0; border: 1px solid #FAEEDA; border-radius: 8px; padding: 12px; }
.card-label-warn { font-size: 10px; font-weight: 600; color: #854F0B; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.card-label-ok { font-size: 10px; font-weight: 600; color: #3B6D11; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }

.job-ref { font-size: 12px; font-weight: 600; color: #185FA5; }
.job-desc { font-size: 13px; font-weight: 500; margin: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-tags { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
.tag-blue { background: #E6F1FB; color: #185FA5; }
.tag-grey { background: #f0f0ee; color: #666; }

.assign-btns { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.btn-assign { padding: 6px 10px; border-radius: 6px; border: 1px solid #185FA5; background: #185FA5; color: #fff; font-size: 11px; cursor: pointer; width: 100%; text-align: left; }
.btn-assign:hover { background: #0C447C; }
.btn-assign-sm { padding: 4px 10px; border-radius: 6px; border: 1px solid #185FA5; background: #185FA5; color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0; }
.btn-assign-sm:hover { background: #0C447C; }

.sched-job { background: #f9f9f7; border: 1px solid #e5e5e3; border-radius: 7px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.sched-info { flex: 1; min-width: 0; }
.sched-eng { font-size: 12px; font-weight: 500; }
.sched-sub { font-size: 11px; color: #888; }
.status-pill { font-size: 10px; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; }

.spinner { width: 20px; height: 20px; border: 2px solid #e5e5e3; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 2rem auto; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-msg { padding: 2rem; text-align: center; color: #aaa; font-size: 13px; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;">
    <span class="logo">R&S Services — Same Site Opportunities</span>
    <span class="topbar-sub" id="topbar-date"></span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="conn-badge" id="conn-badge">Connecting...</span>
    <button class="btn-refresh" onclick="loadAll()">&#8635; Refresh</button>
  </div>
</div>

<div class="metrics">
  <div class="metric"><div class="m-label">Unassigned jobs</div><div class="m-value red" id="m-unassigned">—</div></div>
  <div class="metric"><div class="m-label">Scheduled today</div><div class="m-value blue" id="m-today-total">—</div></div>
  <div class="metric"><div class="m-label">Completed OK</div><div class="m-value green" id="m-today-ok">—</div></div>
  <div class="metric"><div class="m-label">Completed w/ issues</div><div class="m-value" style="color:#854F0B;" id="m-today-issues">—</div></div>
  <div class="metric"><div class="m-label">In progress</div><div class="m-value blue" id="m-today-active">—</div></div>
  <div class="metric"><div class="m-label">Yet to start</div><div class="m-value red" id="m-today-pending">—</div></div>
  <div class="metric"><div class="m-label">Engineers today</div><div class="m-value blue" id="m-today-engs">—</div></div>
  <div class="metric"><div class="m-label">Engineers tomorrow</div><div class="m-value blue" id="m-engs">—</div></div>
  <div class="metric"><div class="m-label">Jobs tomorrow</div><div class="m-value blue" id="m-tomorrow">—</div></div>
  <div class="metric"><div class="m-label">Same-site matches</div><div class="m-value green" id="m-samesite">—</div></div>
</div>

<div class="main" id="main-content">
  <div class="spinner"></div>
</div>

<div id="toast"></div>

<script>
let jobs = [], todaySchedule = {}, todayEngNames = {}, tomorrowSchedule = {}, tomorrowEngNames = {};

const todayDate    = new Date();
const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);

document.getElementById('topbar-date').textContent =
  'Today: ' + todayDate.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) +
  '  |  Tomorrow: ' + tomorrowDate.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
  return r.json();
}

function setBadge(state, text) {
  const b = document.getElementById('conn-badge');
  b.textContent = text;
  b.className = 'conn-badge' + (state === 'error' ? ' error' : '');
}

async function loadAll() {
  setBadge('loading', 'Loading...');
  document.getElementById('main-content').innerHTML = '<div class="spinner"></div>';
  try {
    await Promise.all([loadJobs(), loadToday(), loadTomorrow()]);
    setBadge('ok', 'Live');
    renderSameSite();
  } catch(e) {
    setBadge('error', 'Error');
    document.getElementById('main-content').innerHTML = '<div class="empty-msg">Failed to load data: ' + escHtml(e.message) + '</div>';
  }
}

async function loadJobs() {
  const data = await api('/api/jobs/unassigned');
  jobs = data.jobs || [];
  document.getElementById('m-unassigned').textContent = jobs.length;
}

async function loadToday() {
  const data = await api('/api/schedule/today');
  todaySchedule  = data.byEngineer || {};
  todayEngNames  = data.engNames || {};
  document.getElementById('m-today-engs').textContent = Object.keys(todaySchedule).length;
  const all = Object.values(todaySchedule).flat();
  document.getElementById('m-today-total').textContent   = all.length;
  document.getElementById('m-today-ok').textContent      = all.filter(j => (j.status||'').toLowerCase() === 'completedok').length;
  document.getElementById('m-today-issues').textContent  = all.filter(j => (j.status||'').toLowerCase() === 'completedwithissues').length;
  document.getElementById('m-today-active').textContent  = all.filter(j => ['started','ontheway','suspended'].includes((j.status||'').toLowerCase())).length;
  document.getElementById('m-today-pending').textContent = all.filter(j => ['new','scheduled','sent','read','accepted','refused'].includes((j.status||'').toLowerCase())).length;
}

async function loadTomorrow() {
  const data = await api('/api/schedule/tomorrow');
  tomorrowSchedule = data.byEngineer || {};
  tomorrowEngNames = data.engNames || {};
  const total = Object.values(tomorrowSchedule).reduce((s, a) => s + a.length, 0);
  document.getElementById('m-engs').textContent     = Object.keys(tomorrowSchedule).length;
  document.getElementById('m-tomorrow').textContent = total;
}

function renderSameSite() {
  const container = document.getElementById('main-content');
  const SHOW_STATUSES = ['new','scheduled','sent','read','accepted','refused','ontheway','started','suspended'];

  const scheduledByContact = {};
  const addJobs = (sched, names, dayLabel) => {
    Object.entries(sched).forEach(([engId, engJobs]) => {
      const engName = names[engId] || ('Engineer ' + engId);
      engJobs.forEach(j => {
        const contact = (j.client || '').trim().toLowerCase();
        if (!contact || contact === '—') return;
        if (!SHOW_STATUSES.includes((j.status||'').toLowerCase())) return;
        if (!scheduledByContact[contact]) scheduledByContact[contact] = [];
        scheduledByContact[contact].push({ ...j, engName, engId, dayLabel });
      });
    });
  };

  addJobs(todaySchedule, todayEngNames, 'Today');
  addJobs(tomorrowSchedule, tomorrowEngNames, 'Tomorrow');

  const matches = [];
  jobs.forEach(u => {
    const contact = (u.client || '').trim().toLowerCase();
    if (!contact || contact === '—') return;
    const scheduled = scheduledByContact[contact];
    if (scheduled && scheduled.length > 0) matches.push({ unassigned: u, scheduled });
  });

  document.getElementById('m-samesite').textContent = matches.length;

  if (!matches.length) {
    container.innerHTML = '<div class="empty-msg">No same-site opportunities found — no unassigned jobs share a site with today\'s or tomorrow\'s schedule</div>';
    return;
  }

  container.innerHTML = '<div class="section-header">'
    + matches.length + ' unassigned job' + (matches.length !== 1 ? 's' : '') + ' at a site that already has work scheduled</div>'
    + matches.map(m => {
      const u = m.unassigned;
      return '<div class="match-card">'
        + '<div class="match-site">&#128205; ' + escHtml(u.client) + '</div>'
        + '<div class="match-grid">'

        // Unassigned job
        + '<div class="card-unassigned">'
        + '<div class="card-label-warn">Unassigned</div>'
        + '<div class="job-ref">' + escHtml(u.ref) + '</div>'
        + '<div class="job-desc">' + escHtml(u.desc) + '</div>'
        + '<div class="job-tags">'
        + '<span class="tag tag-blue">' + u.durationMins + ' min</span>'
        + '<span class="tag tag-grey">' + escHtml(u.type) + '</span>'
        + '</div>'
        + '<div class="assign-btns">'
        + m.scheduled.map(s =>
            '<button class="btn-assign"'
            + ' data-jobid="' + u.id + '"'
            + ' data-jobref="' + escHtml(u.ref) + '"'
            + ' data-engid="' + s.engId + '"'
            + ' data-engname="' + escHtml(s.engName) + '"'
            + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 300) + '"'
            + ' data-day="' + s.dayLabel.toLowerCase() + '">'
            + '&#128664; Assign to ' + escHtml(s.engName) + ' (' + s.dayLabel + (s.endTime ? ' after ' + fmtTime(s.endTime) : '') + ')'
            + '</button>'
          ).join('')
        + '</div></div>'

        // Arrow
        + '<div class="arrow">&#8644;</div>'

        // Scheduled jobs
        + '<div>'
        + '<div class="card-label-ok">Already scheduled here</div>'
        + m.scheduled.map(s => {
            const st = (s.status || '').toLowerCase();
            const statusColor = st === 'completedok' ? '#3B6D11' : st === 'completedwithissues' ? '#854F0B' : '#185FA5';
            const statusBg    = st === 'completedok' ? '#EAF3DE' : st === 'completedwithissues' ? '#FAEEDA' : '#E6F1FB';
            return '<div class="sched-job">'
              + '<div class="sched-info">'
              + '<div class="sched-eng">' + escHtml(s.engName) + '</div>'
              + '<div class="sched-sub">' + s.dayLabel + ' · ' + (s.startTime ? fmtTime(s.startTime) : 'TBC') + '</div>'
              + '</div>'
              + '<span class="status-pill" style="background:' + statusBg + ';color:' + statusColor + ';">' + escHtml(s.status || 'scheduled') + '</span>'
              + '<button class="btn-assign-sm"'
              + ' data-jobid="' + u.id + '"'
              + ' data-jobref="' + escHtml(u.ref) + '"'
              + ' data-engid="' + s.engId + '"'
              + ' data-engname="' + escHtml(s.engName) + '"'
              + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 300) + '"'
              + ' data-day="' + s.dayLabel.toLowerCase() + '">Assign</button>'
              + '</div>';
          }).join('')
        + '</div>'
        + '</div></div>';
    }).join('');
}

// Assign button click delegation
document.addEventListener('click', async function(e) {
  const btn = e.target.closest('[data-jobid]');
  if (!btn) return;

  const jobId   = btn.dataset.jobid;
  const jobRef  = btn.dataset.jobref;
  const engId   = btn.dataset.engid;
  const engName = btn.dataset.engname;
  const startMins = parseInt(btn.dataset.start);
  const day     = btn.dataset.day;

  const sched    = day === 'today' ? todaySchedule : tomorrowSchedule;
  const dateObj  = day === 'today' ? todayDate : tomorrowDate;
  const dateStr  = dateObj.toISOString().split('T')[0];
  const h = Math.floor(startMins / 60), m = startMins % 60;
  const plannedStart = dateStr + 'T' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':00';

  btn.disabled = true;
  btn.textContent = 'Assigning...';

  try {
    await api('/api/jobs/' + jobId + '/assign', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ resourceId: engId, plannedStart }),
    });
    showToast(jobRef + ' assigned to ' + engName);
    await loadAll();
  } catch(err) {
    showToast('Failed: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Assign';
  }
});

function timeToMins(dt) {
  if (!dt) return -1;
  try {
    const d = new Date(dt);
    return d.getHours() * 60 + d.getMinutes();
  } catch(e) { return -1; }
}

function fmtTime(dt) {
  try { return new Date(dt).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }
  catch(e) { return dt; }
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3500);
}

loadAll();
setInterval(loadAll, 120000);
</script>
</body>
</html>
